# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# 1.26.2 需要 Java 25（fabric-api 0.158.0 要求 >=25），用 JDK 25 跑 Gradle/javac
org.gradle.java.home=D:/JAVA/Eclipse Adoptium/jdk-25.0.4.7-hotspot

# 网络代理（Clash Verge 混合端口 7897），裸连太慢，全部走代理下载
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1

# Fabric 构建配置（注意：Mojang 从 26.x 起版本号去掉 1. 前缀，1.26.2 = 26.2）
minecraft_version=26.2
loader_version=0.19.3
fabric_version=0.158.0+26.2
modid=classicbar
# 版本号规则：MC版本-构建次数（26.2 从 1 开始）
mod_version=1
maven_group=com.tfar.classicbar
archives_base_name=classicbar