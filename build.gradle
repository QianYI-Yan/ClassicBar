plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = "${minecraft_version}-${mod_version}"
group = maven_group

base {
    archivesName = archives_base_name
}

// 游戏目录配置（版本隔离）：D:\minecraft\Dev
loom {
    runs {
        client {
            client()
            ideConfigGenerated(true)
            programArgs("--gameDir", "D:/minecraft/Dev")
        }
        server {
            server()
            ideConfigGenerated(true)
            programArgs("--gameDir", "D:/minecraft/Dev")
        }
    }
}

// 配置库 maven 仓库（cloth-config、modmenu）
repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

// 使用官方 Mojang mappings，保持现有代码中的类名（net.minecraft.*）不变
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // 配置库（可选后端，运行时按安装情况自动选择）
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:15.0.140"

    // modmenu：仅编译期需要（提供配置 GUI 入口），运行时可选的
    modCompileOnly "com.terraformersmc:modmenu:11.0.4"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}