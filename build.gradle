plugins {
    // 26.x 是非混淆版本（Mojang 直接发布映射后 jar），需用 net.fabricmc.fabric-loom 插件（跳过 remap）
    id 'net.fabricmc.fabric-loom' version '1.17.19'
    id 'maven-publish'
}

version = "${minecraft_version}-${mod_version}"
group = maven_group

base {
    archivesName = archives_base_name
}

// 游戏目录配置（版本隔离）：D:\minecraft\Dev
loom {
    runs {
        client {
            client()
            ideConfigGenerated(true)
            programArgs("--gameDir", "D:/minecraft/Dev")
        }
        server {
            server()
            ideConfigGenerated(true)
            programArgs("--gameDir", "D:/minecraft/Dev")
        }
    }
}

// 配置库 maven 仓库（cloth-config、modmenu）
repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

// 26.x 非混淆版本：不需要 remap，mod 依赖用标准配置
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // 配置库（可选后端，运行时按安装情况自动选择）
    implementation "me.shedaniel.cloth:cloth-config-fabric:26.2.155"

    // modmenu：仅编译期需要（提供配置 GUI 入口），运行时可选的
    compileOnly "com.terraformersmc:modmenu:20.0.1"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

// test 源里只有 Scratchpad 占位类，没有真正的测试；避免 Gradle 9 因未发现测试而失败
tasks.withType(Test).configureEach {
    it.failOnNoDiscoveredTests = false
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}